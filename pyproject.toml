[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lucas-tart-codedep"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别提示词里的代码块依赖上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "lucas-tart" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://lucas-tart.github.io"
Repository = "https://github.com/lucas-tart/codedep"
Issues = "https://github.com/lucas-tart/codedep/issues"

[project.scripts]
codedep = "codedep:main"

[tool.setuptools]
py-modules = ["codedep"]
